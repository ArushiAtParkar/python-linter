name: Lint Python Script
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  lint:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.1'
 
    - name: Run thepythonaction
      uses: cclauss/thepythonaction@0.2.0
      with:
        args: script.py